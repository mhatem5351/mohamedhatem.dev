<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="296" fill="none" aria-describedby="dg-hybrid-rag-w-desc" aria-labelledby="dg-hybrid-rag-w-title" class="dg dg-wide" direction="ltr" lang="en" role="img" viewBox="0 0 1120 296"><title id="dg-hybrid-rag-w-title">Hybrid retrieval with LLM reranking</title><desc id="dg-hybrid-rag-w-desc">Flow diagram. A query is sent in parallel to BM25 keyword search and to dense vector search over embeddings. Their results are merged, reranked by an LLM, and passed as context to an LLM that generates the answer.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}@keyframes dg-hit{0%,24%,to{opacity:0}3%{opacity:1}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#F7F6F3));--_pl:var(--dg-pill,var(--color-bg,#F7F6F3));--_nd:var(--dg-node,var(--color-surface,#FEFDFC));--_ink:var(--color-ink,#131D36);--_ink2:var(--color-ink-2,#323D55);--_mut:var(--color-muted,#525A6C);--_lns:var(--color-line-strong,#CFCCC5);--_edge:var(--color-line-input,#7B808D);--_grid:var(--color-graph-grid,#DAD7D0);--_teal:var(--color-teal,#0C6464);--_teal-f:var(--color-teal-fill,#038586);--_teal-b:var(--color-teal-tint,#E0F4F4);--_teal-l:var(--color-teal-tint-line,#B3DCDC);--_saffron:var(--color-saffron,#885716);--_saffron-f:var(--color-saffron-fill,#B47D19);--_saffron-b:var(--color-saffron-tint,#FAEDDB);--_saffron-l:var(--color-saffron-tint-line,#E8CEAA);--_coral:var(--color-coral,#9D381F);--_coral-f:var(--color-coral-fill,#B84D30);--_coral-b:var(--color-coral-tint,#FFEAE4);--_coral-l:var(--color-coral-tint-line,#FAC4B5);direction:ltr;unicode-bidi:isolate;font-family:&quot;Inter Variable&quot;,Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;-webkit-font-smoothing:antialiased}@media (prefers-color-scheme:dark){.dg{--_cv:var(--dg-canvas,var(--color-bg,#080E1C));--_pl:var(--dg-pill,var(--color-bg,#080E1C));--_nd:var(--dg-node,var(--color-surface,#0F1728));--_ink:var(--color-ink,#F4F0E7)