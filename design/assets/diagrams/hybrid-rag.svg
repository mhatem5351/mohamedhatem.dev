<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="296" fill="none" aria-describedby="dg-hybrid-rag-w-desc" aria-labelledby="dg-hybrid-rag-w-title" class="dg dg-wide" direction="ltr" lang="en" role="img" viewBox="0 0 1120 296"><title id="dg-hybrid-rag-w-title">Hybrid retrieval with LLM reranking</title><desc id="dg-hybrid-rag-w-desc">Flow diagram. A query is sent in parallel to BM25 keyword search and to dense vector search over embeddings. Their results are merged, reranked by an LLM, and passed as context to an LLM that generates the answer, which is then evaluated.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#FBF8F3));--_nd:var(--dg-node,var(--color-surface,#FFFEFB));--_ink:var(--color-ink,#14212B);--_ink2:var(--color-ink-2,#33414C);--_mut:var(--color-muted,#5A6670);--_lns:var(--color-line-strong,#D6CCBA);--_edge:var(--color-line-input,#8E8676);--_grid:var(--color-graph-grid,#DDD3C2);--_teal:var(--color-teal,#0A766C);--_teal-f:var(--color-teal-fill,#16A394);--_teal-b:var(--color-teal-tint,#E3F1EE);--_teal-l:var(--color-teal-tint-line,#B9DFD8);--_saffron:var(--color-saffron,#9C5800);--_saffron-f:var(--color-saffron-fill,#E9A23B);--_saffron-b:var(--color-saffron-tint,#FAEFDC);--_saffron-l:var(--color-saffron-tint-line,#F0D3A4);--_coral:var(--color-coral,#B3421C);--_coral-f:var(--color-coral-fill,#E4683F);--_coral-b:var(--color-coral-tint,#FAE7DF);--_coral-l:var(--color-coral-tint-line,#F0BFA9);--_sky:var(--color-sky,#2B65A6);--_sky-f:var(--color-sky-fill,#4A8FD6);--_sky-b:var(--color-sky-tint,#E4EDF7);--_sky-l:var(--color-sky-tint-line,#B7CDE8);direction:ltr;unicode-bidi:isolate;font-family:&quot;Inter Variable&quot;,Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;-webkit-font-smoothing:antialiased}@media (prefers-color-scheme:dark){.dg{--_cv:var(--dg-canvas,var(--color-bg,#0C151D));--_nd:var(--dg-node,var(--color-surface,#111