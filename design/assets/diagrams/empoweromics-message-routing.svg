<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="584" fill="none" aria-describedby="dg-empoweromics-message-routing-w-desc" aria-labelledby="dg-empoweromics-message-routing-w-title" class="dg dg-wide" direction="ltr" lang="en" role="img" viewBox="0 0 1120 584"><title id="dg-empoweromics-message-routing-w-title">WhatsApp message routing and data integration at Empoweromics</title><desc id="dg-empoweromics-message-routing-w-desc">Architecture diagram in two parts. Message routing: incoming WhatsApp messages are classified, text with an NLP model and images with a computer-vision model, and routed by department to Tech, HR, Accounting, Operations or Marketing. Data engineering: an ETL pipeline moves data from Cosmos DB (NoSQL) to Microsoft SQL Server on scheduled Azure triggers; a data-integration system merges data from 3,008+ real-estate developers, each with its own schema, to feed the real-time e-map.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}@keyframes dg-hit{0%,24%,to{opacity:0}3%{opacity:1}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#F7F6F3));--_pl:var(--dg-pill,var(--color-bg,#F7F6F3));--_nd:var(--dg-node,var(--color-surface,#FEFDFC));--_ink:var(--color-ink,#131D36);--_ink2:var(--color-ink-2,#323D55);--_mut:var(--color-muted,#525A6C);--_lns:var(--color-line-strong,#CFCCC5);--_edge:var(--color-line-input,#7B808D);--_grid:var(--color-graph-grid,#DAD7D0);--_teal:var(--color-teal,#0C6464);--_teal-f:var(--color-teal-fill,#038586);--_teal-b:var(--color-teal-tint,#E0F4F4);--_teal-l:var(--color-teal-tint-line,#B3DCDC);--_saffron:var(--color-saffron,#885716);--_saffron-f:var(--color-saffron-fill,#B47D19);--_saffron-b:var(--color-saffron-tint,#FAEDDB);--_saffron-l:var(--color-saffron-tint-line,#E8CEAA);--_coral:var(--color-coral,#9D381F);--_coral-f:var(--color-coral-fill,#B84D30);--_coral-b:var(--color-coral-tint,#FFEAE4);--_coral-l:var(--color-coral-tint-line,#FAC4B5);--_slate:var(--color-slate,#505A6B);