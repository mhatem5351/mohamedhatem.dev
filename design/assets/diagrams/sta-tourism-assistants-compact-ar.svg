<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1064" fill="none" aria-describedby="dg-sta-tourism-assistants-c-ar-desc" aria-labelledby="dg-sta-tourism-assistants-c-ar-title" class="dg dg-compact dg-ar" direction="rtl" lang="ar" role="img" viewBox="0 0 320 1064"><title id="dg-sta-tourism-assistants-c-ar-title">مساعدا الهيئة السعودية للسياحة: وكيل واحد للزوار والموظفين</title><desc id="dg-sta-tourism-assistants-c-ar-desc">مخطط معماري. يدخل جمهوران: الزوار الذين يستخدمون «نورة» بالعربية أو الإنجليزية، وموظفو الهيئة الذين يستخدمون «مساعد الموظفين». يمر الطرفان عبر طبقة الصلاحيات التي تحدد الأدوات والمعرفة التي يحق للجلسة استخدامها، فلا يصل الزائر أبدًا إلى أدوات الموظفين أو بياناتهم. تسلّم الطبقة الطلب إلى وكيل LangGraph واحد. يستدعي الوكيل أدوات محددة الأنواع تعيد نتائجها في بطاقات: 96 أداة، منها 27 متاحة للزوار. تُستدعى أدوات الاستعلام (الوجهات والفعاليات، والتأشيرات والطقس) مباشرةً، أما الأدوات التي تحجز أو تطلب شيئًا (خطط الرحلات، وطلبات الموظفين مثل حجز قاعات الاجتماعات والإجازات وطلبات قهوة المكتب) فلا يُوصَل إليها إلا عبر الموافقة البشرية: كل حجز أو طلب ينتظر تأكيد المستخدم. ويبحث الوكيل أيضًا في وثائق الهيئة ومحتواها السياحي، وتذكر إجاباته مصادرها. ويقيس التقييم جودة الإجابات ودقة الاسترجاع.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}@keyframes dg-hit{0%,24%,to{opacity:0}3%{opacity:1}}@keyframes dg-breathe{50%{opacity:.35}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#F7F6F3));--_pl:var(--dg-pill,var(--color-bg,#F7F6F3));--_nd:var(--dg-node,var(--color-surface,#FEFDFC));--_ink:var(--color-ink,#131D36);--_ink2:var(--color-ink-2,#323D55);--_mut:var(--color-muted,#525A6C);--_lns:var(--color-line-strong,#CFCCC5);--_edge:var(--color-line-input,#7B808D);--_grid:var(--color-graph-grid,#DAD7D0);--_co:var(--color-accent-solid,#2348A1);--_con:var(--color-on-accent,#FFFFFF);--_teal:var(--color-teal,#0C6464);--_teal-f:var(--color-teal-fill,#038586);--_teal-b:var(--color-teal-tint,#E0F4F4);--_teal-l:var(--colo