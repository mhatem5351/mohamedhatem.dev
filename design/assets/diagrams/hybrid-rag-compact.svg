<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" fill="none" aria-describedby="dg-hybrid-rag-c-desc" aria-labelledby="dg-hybrid-rag-c-title" class="dg dg-compact" direction="ltr" lang="en" role="img" viewBox="0 0 320 680"><title id="dg-hybrid-rag-c-title">Hybrid retrieval with LLM reranking</title><desc id="dg-hybrid-rag-c-desc">Flow diagram. A query is sent in parallel to BM25 keyword search and to dense vector search over embeddings. Their results are merged, reranked by an LLM, and passed as context to an LLM that generates the answer.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}@keyframes dg-hit{0%,24%,to{opacity:0}3%{opacity:1}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#F7F6F3));--_pl:var(--dg-pill,var(--color-bg,#F7F6F3));--_nd:var(--dg-node,var(--color-surface,#FEFDFC));--_ink:var(--color-ink,#131D36);--_ink2:var(--color-ink-2,#323D55);--_mut:var(--color-muted,#525A6C);--_lns:var(--color-line-strong,#CFCCC5);--_edge:var(--color-line-input,#7B808D);--_grid:var(--color-graph-grid,#DAD7D0);--_co:var(--color-accent-solid,#2348A1);--_con:var(--color-on-accent,#FFFFFF);--_teal:var(--color-teal,#0C6464);--_teal-f:var(--color-teal-fill,#038586);--_teal-b:var(--color-teal-tint,#E0F4F4);--_teal-l:var(--color-teal-tint-line,#B3DCDC);--_saffron:var(--color-saffron,#885716);--_saffron-f:var(--color-saffron-fill,#B47D19);--_saffron-b:var(--color-saffron-tint,#FAEDDB);--_saffron-l:var(--color-saffron-tint-line,#E8CEAA);--_coral:var(--color-coral,#9D381F);--_coral-f:var(--color-coral-fill,#B84D30);--_coral-b:var(--color-coral-tint,#FFEAE4);--_coral-l:var(--color-coral-tint-line,#FAC4B5);direction:ltr;unicode-bidi:isolate;font-family:&quot;Inter Variable&quot;,Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;-webkit-font-smoothing:antialiased}@media (prefers-color-scheme:dark){.dg{--_cv:var(--dg-canvas,var(--color-bg,#080E1C));--_pl:var(--dg-pill,var(--color-bg,#080E1C));--_nd:var(--dg-node,var(--color-surface,#0F1728));--_ink:var(--color-ink,#F4F0E7);--_ink2:var(--color-ink-2,#CBD1DC);--_mut:var(--color-muted,#A1A9BC);--_lns:var(--color-line-strong,#363F54);--_edge:var(--color-line-input,#6B748A);--_grid:var(--color-graph-grid,#222A3C);--_co:var(--color-accent-solid,#E8B458);--_con:var(--color-on-accent,#091123);--_teal:var(--color-teal,#82D9D5);--_teal-f:var(--color-teal-fill,#5AC0BC);--_teal-b:var(--color-teal-tint,#0B2827);--_teal-l:var(--color-teal-tint-line,#184442);--_saffron:var(--color-saffron,#E9BB61);--_saffron-f:var(--color-saffron-fill,#E8B458);--_saffron-b:var(--color-saffron-tint,#2E2006);--_saffron-l:var(--color-saffron-tint-line,#4D3810);--_coral:var(--color-coral,#F3957B);--_coral-f:var(--color-coral-fill,#DA6C50);--_coral-b:var(--color-coral-tint,#371911);--_coral-l:var(--color-coral-tint-line,#5C2C20)}}.dg-cv,.dg-ext .dg-b{fill:var(--_cv)}.dg-dots{fill:var(--_grid)}.dg-b{fill:var(--_nd);stroke:var(--nl,var(--_lns));stroke-width:1.5}.dg-w{fill:var(--nb)}.dg-g{color:var(--ni,var(--_mut));fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dg-c-saffron{--nb:var(--_saffron-b);--nl:var(--_saffron-l);--ni:var(--_saffron);--pf:var(--_saffron-f)}.dg-c-coral{--nb:var(--_coral-b);--nl:var(--_coral-l);--ni:var(--_coral);--pf:var(--_coral-f)}.dg-ext .dg-b{stroke:var(--_edge);stroke-dasharray:4 4}.dg-ext .dg-g{color:var(--_ink2)}.dg-t{font:600 13px/1&quot;Inter Variable&quot;,Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;fill:var(--_ink)}.dg-s{font:500 12px/1&quot;JetBrains Mono Variable&quot;,&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--_mut)}.dg-grp{fill:var(--dg-group-fill,none);stroke:var(--_lns);stroke-dasharray:4 4}.dg-tab{font:600 12px/1&quot;JetBrains Mono Variable&quot;,&quot;JetBrains Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;fill:var(--_mut)}.dg-elbg,.dg-ta