<svg xmlns="http://www.w3.org/2000/svg" width="352" height="1088" fill="none" aria-describedby="dg-wakeb-multi-agent-chatbot-c-desc" aria-labelledby="dg-wakeb-multi-agent-chatbot-c-title" class="dg dg-compact" direction="ltr" lang="en" role="img" viewBox="0 0 352 1088"><title id="dg-wakeb-multi-agent-chatbot-c-title">Multi-agent chatbot: fully async LangGraph with six specialised agents</title><desc id="dg-wakeb-multi-agent-chatbot-c-desc">Architecture diagram. A user writes in Arabic or English. Requests pass through Nginx, a reverse proxy, to Dockerized FastAPI services; key internal APIs use gRPC. Inside a fully async LangGraph graph, Command-based routing with no static edges hands control between six specialised agents, built as modular subgraphs. The graph calls four back ends: the Qwen LLM served with vLLM on A100 GPUs; hybrid retrieval that combines vector and BM25 search with LLM reranking; Brave Search through MCP; and a SQLite node-level cache.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#FBF8F3));--_nd:var(--dg-node,var(--color-surface,#FFFEFB));--_ink:var(--color-ink,#14212B);--_ink2:var(--color-ink-2,#33414C);--_mut:var(--color-muted,#5A6670);--_lns:var(--color-line-strong,#D6CCBA);--_edge:var(--color-line-input,#8E8676);--_grid:var(--color-graph-grid,#DDD3C2);--_teal:var(--color-teal,#0A766C);--_teal-f:var(--color-teal-fill,#16A394);--_teal-b:var(--color-teal-tint,#E3F1EE);--_teal-l:var(--color-teal-tint-line,#B9DFD8);--_saffron:var(--color-saffron,#9C5800);--_saffron-f:var(--color-saffron-fill,#E9A23B);--_saffron-b:var(--color-saffron-tint,#FAEFDC);--_saffron-l:var(--color-saffron-tint-line,#F0D3A4);--_slate:var(--color-slate,#4A6072);--_slate-f:var(--color-slate-fill,#7F99AE);--_slate-b:var(--color-slate-tint,#E8EDF1);--_slate-l:var(--color-slate-tint-line,#C3CFD9);--_coral:var(--color-coral,#B3421C);--_coral-f:var(--color-coral-fill,#E4683F);--_coral-b:v