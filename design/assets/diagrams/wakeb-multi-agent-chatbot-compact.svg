<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1032" fill="none" aria-describedby="dg-wakeb-multi-agent-chatbot-c-desc" aria-labelledby="dg-wakeb-multi-agent-chatbot-c-title" class="dg dg-compact" direction="ltr" lang="en" role="img" viewBox="0 0 320 1032"><title id="dg-wakeb-multi-agent-chatbot-c-title">Multi-agent chatbot: fully async LangGraph with six specialised agents</title><desc id="dg-wakeb-multi-agent-chatbot-c-desc">Architecture diagram. A user writes in Arabic or English. Requests pass through Nginx, a reverse proxy, to Dockerised FastAPI services; key internal APIs use gRPC. Inside a fully async LangGraph graph, routing through LangGraph Command instead of fixed edges hands control between six specialised agents, built as modular subgraphs. The graph calls four back ends: the Qwen LLM served with vLLM on A100 GPUs; hybrid retrieval that combines vector and BM25 search with LLM reranking; Brave Search through MCP; and a SQLite node-level cache.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}@keyframes dg-hit{0%,24%,to{opacity:0}3%{opacity:1}}@keyframes dg-breathe{50%{opacity:.35}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#F7F6F3));--_pl:var(--dg-pill,var(--color-bg,#F7F6F3));--_nd:var(--dg-node,var(--color-surface,#FEFDFC));--_ink:var(--color-ink,#131D36);--_ink2:var(--color-ink-2,#323D55);--_mut:var(--color-muted,#525A6C);--_lns:var(--color-line-strong,#CFCCC5);--_edge:var(--color-line-input,#7B808D);--_grid:var(--color-graph-grid,#DAD7D0);--_co:var(--color-accent-solid,#2348A1);--_con:var(--color-on-accent,#FFFFFF);--_teal:var(--color-teal,#0C6464);--_teal-f:var(--color-teal-fill,#038586);--_teal-b:var(--color-teal-tint,#E0F4F4);--_teal-l:var(--color-teal-tint-line,#B3DCDC);--_slate:var(--color-slate,#505A6B);--_slate-f:var(--color-slate-fill,#515B6C);--_slate-b:var(--color-slate-tint,#EDEFF4);--_slate-l:var(--color-slate-tint-line,#CED3DC);--_coral:var(--color-coral,#9D381F);--_coral-f:va