<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero graph</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="bundle/hero-graph.css">
<style>
  @font-face { font-family: "Space Grotesk Variable"; src: url(../fonts/space-grotesk-latin-wght.woff2) format("woff2"); font-weight: 300 700; font-display: swap }
  @font-face { font-family: "Inter Variable"; src: url(../fonts/inter-latin-wght.woff2) format("woff2"); font-weight: 100 900; font-display: swap }
  @font-face { font-family: "JetBrains Mono Variable"; src: url(../fonts/jetbrains-mono-ascii-wght.woff2) format("woff2"); font-weight: 100 800; font-display: swap }
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url(../fonts/ibm-plex-sans-arabic-400.woff2) format("woff2"); font-weight: 400; font-display: swap }
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url(../fonts/ibm-plex-sans-arabic-500.woff2) format("woff2"); font-weight: 500; font-display: swap }
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url(../fonts/ibm-plex-sans-arabic-600.woff2) format("woff2"); font-weight: 600; font-display: swap }
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url(../fonts/ibm-plex-sans-arabic-700.woff2) format("woff2"); font-weight: 700; font-display: swap }

  *, *::before, *::after { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; background: var(--color-bg); color: var(--color-ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased }

  /* demo controls (hidden with ?chrome=0) */
  .controls { position: fixed; z-index: 20; inset-block-end: 16px; inset-inline-end: 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--color-line); border-radius: 12px; background: var(--color-surface); box-shadow: var(--shadow-md);
    font: 500 12px/1 var(--font-mono); color: var(--color-muted) }
  .controls fieldset { display: flex; gap: 4px; align-items: center; margin: 0; padding: 0; border: 0 }
  .controls legend { float: inline-start; margin-inline-end: 6px; text-transform: uppercase; letter-spacing: var(--tracking-label) }
  .controls button { padding: 6px 9px; border: 1px solid var(--color-line); border-radius: 8px; background: transparent; color: var(--color-ink-2); font: inherit; cursor: pointer }
  .controls button[aria-pressed="true"] { background: var(--color-accent-tint); border-color: var(--color-accent-tint-line); color: var(--color-accent) }
  .controls button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px }
  .no-chrome .controls { display: none }

  /* a hero-like context: text column + graph card */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 608px); gap: clamp(32px, 4vw, 64px); align-items: center;
    max-width: var(--container-max); min-height: min(100vh, 860px); margin: 0 auto; padding: 72px var(--space-gutter) 48px }
  .eyebrow { margin: 0 0 18px; font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-muted) }
  .eyebrow span { color: var(--color-saffron) }
  :lang(ar) .eyebrow { font-family: var(--font-sans); font-size: var(--text-sm); text-transform: none }
  h1 { margin: 0; font: 700 var(--text-display)/var(--lh-display) var(--font-display); letter-spacing: var(--text-display--letter-spacing) }
  .role { margin: 14px 0 0; font: 500 var(--text-xl)/var(--lh-snug) var(--font-display); color: var(--color-ink-2) }
  .role b { font-weight: 500; color: var(--color-accent) }
  .lead { max-width: 34rem; margin: 22px 0 0; font-size: var(--text-md); line-height: var(--lh-lead); color: var(--color-ink-2) }
  .stripe { display: flex; gap: 6px; margin-top: 30px }
  .stripe i { display: block; height: 5px; border-radius: 2.5px }
  .stripe i:nth-child(1) { width: 54px; background: var(--color-teal-fill) }
  .stripe i:nth-child(2) { width: 30px; background: var(--color-saffron-fill) }
  .stripe i:nth-child(3) { width: 16px; background: var(--color-coral-fill) }

  .card { position: relative; isolation: isolate; overflow: hidden; padding: clamp(8px, 2.6vw, 24px); border: 1px solid var(--color-line); border-radius: var(--radius-xl);
    background: var(--color-surface); box-shadow: var(--shadow-lg), var(--inset-highlight) }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(42% 46% at 50% 48%, var(--color-glow-1), transparent 70%),
      radial-gradient(50% 50% at 100% 0, var(--color-glow-2), transparent 70%),
      radial-gradient(50% 50% at 0 100%, var(--color-glow-3), transparent 70%) }
  .card::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(circle at 2px 2px, var(--color-graph-grid) 1.15px, transparent 1.4px); background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(75% 70% at 50% 50%, #000 20%, transparent 85%); mask-image: radial-gradient(75% 70% at 50% 50%, #000 20%, transparent 85%) }

  @media (max-width: 64rem) {
    .hero { grid-template-columns: minmax(0, 1fr); min-height: 0; padding-top: 40px; gap: 28px }
  }
  @media (max-width: 40rem) {
    .hero { padding-inline: 20px }
  }
</style>
</head>
<body>
<main class="hero">
  <div class="intro">
    <p class="eyebrow" data-i="eyebrow">Cairo <span>/</span> Remote <span>/</span> EN · AR</p>
    <h1 data-i="name">Mohamed Hatem</h1>
    <p class="role" data-i="role">AI Team Lead · <b>Globant</b></p>
    <p class="lead" data-i="lead">I design, ship and run production LLM systems: multi-agent orchestration, retrieval (RAG), self-hosted model serving, and the evaluation and monitoring that keep them honest.</p>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div class="card">
    <div class="slot"><!-- hg:ssr --><figure class="hg" data-hero-graph dir="ltr" lang="en"><figcaption class="hg-sr">An illustration of the pattern behind the agent systems I build. guard screens the input; the orchestrator routes the request to retrieve for hybrid search and to rerank to keep the best context; generate writes the answer; evaluate checks its quality. When live data is needed, the orchestrator calls tools over MCP. Not every system uses every step.</figcaption><svg class="hg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none" direction="ltr" tabindex="-1" role="group" aria-label="Agent graph" aria-describedby="hg-desc" data-dir="ltr" data-lang="en" data-pause="Pause animation" data-play="Play animation"><desc id="hg-desc">Use the arrow keys to move between agents. Press Enter for details.</desc><g class="hg-descs" display="none" aria-hidden="true"><text id="hg-d-guard">Screens the input before a model sees it, like the prompt-injection guardrail in my open-source rag-answering-service.</text><text id="hg-d-orchestrator">Routes each turn to the right agent: LangGraph Command routing across 6 agents at Wakeb Data, and 14 agents in the ArabsStock Assistant.</text><text id="hg-d-retrieve">Hybrid retrieval: dense vectors plus BM25 keyword search, as in the RAG behind the Wakeb Data chatbot.</text><text id="hg-d-rerank">An LLM reranks the candidates, so only the best context reaches the prompt (the Wakeb Data chatbot's hybrid RAG).</text><text id="hg-d-generate">Writes the answer. At Wakeb Data: a self-hosted Qwen model served by vLLM on A100 GPUs.</text><text id="hg-d-evaluate">Checks answer quality: agent evaluation in production at ArabsStock, quality monitoring at Wakeb Data, and my staged-llm-evaluator (verdict computed in code).</text><text id="hg-d-tools">Calls external tools over MCP, such as Brave Search for live web results at Wakeb Data.</text></g><g class="hg-sl" aria-hidden="true"><path class="hg-e hg-pe" data-a="query" data-b="guard" d="M40 109Q40 242 91 242"/><path class="hg-e hg-rim" data-a="retrieve" data-b="rerank" d="M220.4 75.9Q300 60 379.6 75.9"/><path class="hg-e hg-rim" data-a="rerank" data-b="generate" d="M427.2 107.8Q458 154.2 471.1 211.8"/><path class="hg-e hg-rim" data-a="generate" data-b="evaluate" d="M471.1 272.2Q458 329.8 427.2 376.2"/><path class="hg-e hg-pe" data-a="evaluate" data-b="answer" d="M441 402Q560 402 560 451"/><path class="hg-rt hg-c-teal" data-a="query" data-b="guard" d="M40 109Q40 242 91 242"/><path class="hg-rt hg-c-saffron" data-a="retrieve" data-b="rerank" d="M220.4 75.9Q300 60 379.6 75.9"/><path class="hg-rt hg-c-saffron" data-a="rerank" data-b="generate" d="M427.2 107.8Q458 154.2 471.1 211.8"/><path class="hg-rt hg-c-coral" data-a="generate" data-b="evaluate" d="M471.1 272.2Q458 329.8 427.2 376.2"/><path class="hg-rt hg-c-sky" data-a="evaluate" data-b="answer" d="M441 402Q560 402 560 451"/><path class="hg-rh hg-c-teal" data-a="query" data-b="guard" d="M40 109Q40 242 91 242"/><path class="hg-rh hg-c-saffron" data-a="retrieve" data-b="rerank" d="M220.4 75.9Q300 60 379.6 75.9"/><path class="hg-rh hg-c-saffron" data-a="rerank" data-b="generate" d="M427.2 107.8Q458 154.2 471.1 211.8"/><path class="hg-rh hg-c-coral" data-a="generate" data-b="evaluate" d="M471.1 272.2Q458 329.8 427.2 376.2"/><path class="hg-rh hg-c-sky" data-a="evaluate" data-b="answer" d="M441 402Q560 402 560 451"/></g><g class="hg-spokes" aria-hidden="true"><path class="hg-e hg-sp" data-a="orchestrator" data-b="guard" d="M243 242Q211 242 153 242"/><path class="hg-e hg-sp" data-a="orchestrator" data-b="retrieve" d="M267.7 195Q245 162 207.6 107.5"/><path class="hg-e hg-sp" data-a="orchestrator" data-b="rerank" d="M332.3 195Q355 162 392.4 107.5"/><path class="hg-e hg-sp" data-a="orchestrator" data-b="generate" d="M357 242Q389 242 447 242"/><path class="hg-e hg-sp" data-a="orchestrator" data-b="evaluate" d="M332.3 289Q355 322 392.4 376.5"/><path class="hg-e hg-sp   <fieldset><legend>theme</legend><button type="button" data-k="theme" data-v="light">light</button><button type="button" data-k="theme" data-v="dark">dark</button></fieldset>
  <fieldset><legend>locale</legend><button type="button" data-k="lang" data-v="en">EN</button><button type="button" data-k="lang" data-v="ar">AR</button></fieldset>
  <fieldset><legend>motion</legend><button type="button" data-k="motion" data-v="auto">auto</button><button type="button" data-k="motion" data-v="reduce">reduce</button></fieldset>
</div>

<script>
  // apply ?theme=&lang=&motion=&chrome= before the graph module loads (modules are deferred)
  (function () {
    var p = new URLSearchParams(location.search), d = document.documentElement;
    d.dataset.theme = p.get("theme") === "dark" ? "dark" : "light";
    if (p.get("chrome") === "0") d.classList.add("no-chrome");
    if (p.get("motion") === "reduce") document.querySelector(".slot .hg").dataset.motion = "reduce";
  })();
</script>
<script type="module">
  import { mountHeroGraph } from "./bundle/hero-graph.js";
  import { renderHeroGraph } from "./bundle/hero-graph.render.js";

  const T = {
    en: { eyebrow: 'Cairo <span>/</span> Remote <span>/</span> EN · AR', name: "Mohamed Hatem", role: "AI Team Lead · <b>Globant</b>",
      lead: "I design, ship and run production LLM systems: multi-agent orchestration, retrieval (RAG), self-hosted model serving, and the evaluation and monitoring that keep them honest." },
    ar: { eyebrow: 'القاهرة <span>/</span> عن بُعد', name: "محمد حاتم", role: "قائد فريق الذكاء الاصطناعي · <b>Globant</b>",
      lead: "أصمّم أنظمة النماذج اللغوية الكبيرة وأطلقها وأشغّلها في الإنتاج: تنسيق متعدد الوكلاء، والاسترجاع (RAG)، واستضافة النماذج ذاتيًا، والتقييم والمراقبة التي تُبقيها موثوقة." },
  };
  const p = new URLSearchParams(location.search);
  const state = { theme: document.documentElement.dataset.theme, lang: p.get("lang") === "ar" ? "ar" : "en", motion: p.get("motion") === "reduce" ? "reduce" : "auto" };
  const slot = document.querySelector(".slot");
  let ctl = mountHeroGraph(slot.querySelector(".hg"));

  function remount() {
    ctl.destroy();
    const d = state.lang === "ar" ? "rtl" : "ltr";
    slot.innerHTML = renderHeroGraph({ dir: d, lang: state.lang });
    const host = slot.querySelector(".hg");
    if (state.motion === "reduce") host.dataset.motion = "reduce";
    ctl = mountHeroGraph(host);
  }
  function apply(first) {
    const d = document.documentElement;
    d.dataset.theme = state.theme;
    d.lang = state.lang;
    d.dir = state.lang === "ar" ? "rtl" : "ltr";
    for (const [k, v] of Object.entries(T[state.lang])) document.querySelector(`[data-i="${k}"]`).innerHTML = v;
    document.querySelectorAll(".controls button").forEach(b => b.setAttribute("aria-pressed", String(state[b.dataset.k] === b.dataset.v)));
    if (!first) remount();
  }
  document.querySelector(".controls").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || state[b.dataset.k] === b.dataset.v) return;
    state[b.dataset.k] = b.dataset.v;
    if (b.dataset.k === "theme") { document.documentElement.dataset.theme = state.theme; apply(true); } else apply(false);
  });
  apply(true);
  if (state.lang === "ar") remount();
  window.__hg = () => ctl;
</script>
</body>
</html>
