<figure class="hg" data-hero-graph dir="ltr" lang="en"><figcaption class="hg-sr">An illustration of the pattern behind the agent systems I build. guard screens the input; the orchestrator routes the request to retrieve for hybrid search and to rerank to keep the best context; generate writes the answer; evaluate checks its quality. When live data is needed, the orchestrator calls tools over MCP. Not every system uses every step.</figcaption><svg class="hg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none" direction="ltr" tabindex="-1" role="group" aria-label="Agent graph" aria-describedby="hg-desc" data-dir="ltr" data-lang="en" data-pause="Pause animation" data-play="Play animation"><desc id="hg-desc">Use the arrow keys to move between agents. Press Enter for details.</desc><g class="hg-descs" display="none" aria-hidden="true"><text id="hg-d-guard">Screens the input before a model sees it, like the prompt-injection guardrail in my open-source rag-answering-service.</text><text id="hg-d-orchestrator">Routes each turn to the right agent: LangGraph Command routing across 6 agents at Wakeb Data, and 14 agents in the ArabsStock Assistant.</text><text id="hg-d-retrieve">Hybrid retrieval: dense vectors plus BM25 keyword search, as in the RAG behind the Wakeb Data chatbot.</text><text id="hg-d-rerank">An LLM reranks the candidates, so only the best context reaches the prompt (the Wakeb Data chatbot's hybrid RAG).</text><text id="hg-d-generate">Writes the answer. At Wakeb Data: a self-hosted Qwen model served by vLLM on A100 GPUs.</text><text id="hg-d-evaluate">Checks answer quality: agent evaluation in production at ArabsStock, quality monitoring at Wakeb Data, and my staged-llm-evaluator (verdict computed in code).</text><text id="hg-d-tools">Calls external tools over MCP, such as Brave Search for live web results at Wakeb Data.</text></g><g class="hg-sl" aria-hidden="true"><path class="hg-e hg-pe" data-a="query" data-b="guar
