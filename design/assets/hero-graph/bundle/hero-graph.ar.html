<figure class="hg" data-hero-graph dir="rtl" lang="ar"><figcaption class="hg-sr">توضيح للنمط الذي تقوم عليه أنظمة الوكلاء التي أبنيها: يفحص الحارس (guard) المدخلات، ثم يوجّه المنسِّق (orchestrator) الطلب إلى الاسترجاع (retrieve) للبحث الهجين، وإلى إعادة الترتيب (rerank) لإبقاء أنسب سياق، ثم يكتب التوليد (generate) الإجابة، ويتحقق التقييم (evaluate) من جودتها. وعند الحاجة إلى بيانات مباشرة يستدعي المنسِّق الأدوات (tools) عبر MCP. ولا يستخدم كل نظام جميع هذه الخطوات.</figcaption><svg class="hg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none" direction="ltr" tabindex="-1" role="group" aria-label="مخطط الوكلاء" aria-describedby="hg-desc" data-dir="rtl" data-lang="ar" data-pause="إيقاف الحركة مؤقتًا" data-play="تشغيل الحركة"><desc id="hg-desc">استخدم مفاتيح الأسهم للتنقل بين الوكلاء، واضغط Enter لعرض التفاصيل.</desc><g class="hg-descs" display="none" aria-hidden="true"><text id="hg-d-guard">يفحص المدخلات قبل أن تصل إلى النموذج، مثل حاجز الحماية من حقن الموجّهات في مشروعي مفتوح المصدر rag-answering-service.</text><text id="hg-d-orchestrator">يوجّه كل رسالة إلى الوكيل المناسب: توجيه عبر Command في LangGraph بين 6 وكلاء في Wakeb Data، و14 وكيلًا في مساعد ArabsStock.</text><text id="hg-d-retrieve">استرجاع هجين: متجهات دلالية مع بحث BM25 بالكلمات المفتاحية، كما في خط RAG وراء روبوت المحادثة في Wakeb Data.</text><text id="hg-d-rerank">نموذج لغوي يعيد ترتيب النتائج، فلا يصل إلى الموجّه إلا أنسب سياق (البحث الهجين لروبوت المحادثة في Wakeb Data).</text><text id="hg-d-generate">يكتب الإجابة. في Wakeb Data: نموذج Qwen مستضاف ذاتيًا يخدّمه vLLM على وحدات A100.</text><text id="hg-d-evaluate">يتحقق من جودة الإجابات: تقييم الوكلاء في بيئة الإنتاج في ArabsStock، ومراقبة الجودة في Wakeb Data، ومشروعي staged-llm-evaluator الذي يحسب الحكم في الكود.</text><text id="hg-d-tools">يستدعي أدوات خارجية عبر MCP، مثل Brave Search لنتائج الويب الحية في Wakeb Data.</text></g><g class="hg-sl" aria-hidden="true"><path class="hg-e hg-pe" data-a="query" d
