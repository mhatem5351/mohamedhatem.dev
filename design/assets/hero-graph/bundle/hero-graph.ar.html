<figure class="hg" data-hero-graph dir="rtl" lang="ar"><figcaption class="hg-sr">كيف يمرّ الطلب عبر أنظمة الوكلاء التي أبنيها: يبدأ الاستعلام بالحارس (guard) الذي يفحص المدخلات، ثم يوجّهه المنسِّق (orchestrator) إلى الاسترجاع (retrieve) للبحث الهجين، فإعادة الترتيب (rerank) لإبقاء أنسب سياق، ثم التوليد (generate) لكتابة الإجابة بنموذج مستضاف ذاتيًا، فالتقييم (evaluate) قبل إرجاع الإجابة. وعند الحاجة إلى بيانات مباشرة يستدعي المنسِّق الأدوات (tools) عبر MCP.</figcaption><svg class="hg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" fill="none" direction="ltr" tabindex="-1" role="group" aria-label="مخطط الوكلاء" aria-describedby="hg-desc" data-dir="rtl" data-lang="ar" data-pause="إيقاف الحركة مؤقتًا" data-play="تشغيل الحركة"><desc id="hg-desc">استخدم مفاتيح الأسهم للتنقل بين الوكلاء، واضغط Enter لعرض التفاصيل.</desc><g class="hg-descs" display="none" aria-hidden="true"><text id="hg-d-guard">يفحص المدخلات أولًا: محاولات حقن الأوامر والأسئلة الخارجة عن النطاق، قبل أن تصل إلى أي نموذج.</text><text id="hg-d-orchestrator">يوجّه كل رسالة إلى الوكيل المناسب، عبر LangGraph وتوجيه قائم على الأوامر بين وكلاء متخصصين.</text><text id="hg-d-retrieve">استرجاع هجين: متجهات دلالية مع بحث BM25 بالكلمات المفتاحية في قاعدة المعرفة.</text><text id="hg-d-rerank">نموذج لغوي يعيد ترتيب النتائج، فلا يصل إلى السياق إلا الأنسب.</text><text id="hg-d-generate">يكتب الإجابة نموذج مستضاف ذاتيًا: Qwen عبر vLLM على وحدات A100.</text><text id="hg-d-evaluate">يقيّم الإجابات من حيث الجودة والأمان، والحكم النهائي يُحسب في الكود لا في النموذج.</text><text id="hg-d-tools">يستدعي أدوات خارجية عبر MCP، مثل البحث المباشر على الويب.</text></g><g class="hg-sl" aria-hidden="true"><path class="hg-e hg-pe" data-a="query" data-b="guard" d="M560 109Q560 242 509 242"/><path class="hg-e hg-rim" data-a="retrieve" data-b="rerank" d="M379.6 75.9Q300 60 220.4 75.9"/><path class="hg-e hg-rim" data-a="rerank" data-b="generate" d="M172.8 107.8Q142 154.2 128.9 211.8"/><path class="hg-e
