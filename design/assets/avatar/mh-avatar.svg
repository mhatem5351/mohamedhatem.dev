<!--
  Mohamed Hatem, drawn for the chat launcher (traced from the profile photo). Flat, in the brand palette, on the
  lapis-night disc with a lapis glow, set in a gold rim (the default; the turquoise disc is the data-disc="teal" preset
  in chat-avatar.ts).
  Layers (classes) for the motion in site/src/scripts/chat-avatar.ts: .av-disc / .av-glow / .av-rim (the disc, CSS-driven:
  --mh-av-disc, --mh-av-glow, --mh-av-glow-o, --mh-av-rim), .av-body, .av-head (nods), .av-eyes (blink; centre y 45.25),
  .av-jaw (talks; hinge y 65.4), .av-arm > .av-wave (sways from the elbow) > .av-hand (waves from the wrist, drawn at 0,0).
  The disc is r 58 around 60,60 in user units; the viewBox leaves room for the raised hand. ids use the "mha-" prefix.
-->
