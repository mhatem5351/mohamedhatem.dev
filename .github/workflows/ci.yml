# Checks on every push and pull request (free on public repositories). Nothing here calls Gemini, Cloudflare or
# Turnstile; the Worker and widget tests mock them. One secret, used by one step only, before npm ci:
# CONFIDENTIAL_HMAC_KEY, the key of the unnamed client's hashed names (worker/src/chat/confidential-hashes.json).
#   checks      the keyed name check (every tracked file, before any package is installed), content QA (secrets,
#               copy rules), generated files up to date, type-check, Worker + widget unit tests (a fixed test key),
#               widget size budget
#   widget-e2e  the chat widget in Chromium (desktop and mobile projects, mocked API, axe)
#   site-unit   the site's unit tests
# Actions are pinned to commit SHAs (tag in the comment); update both together.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same major as the machine that builds and deploys: the widget size budget is measured with gzip, and Node 24's
  # zlib compresses the same bundle about 250 bytes larger than Node 26's.
  NODE_VERSION: "26"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Before npm ci, so no installed package (install scripts, a tampered tsx) runs while the key is in the
      # environment: plain Node and the repository's own dependency-free matcher only. GitHub withholds secrets from
      # pull requests opened from forks and from Dependabot's runs; there the check is skipped with a warning
      # (CONFIDENTIAL_KEY_OPTIONAL). Everywhere else a missing or wrong key fails the job.
      - name: Unnamed-client name check (keyed hashes) over every tracked file
        run: node worker/src/chat/confidential-node.mjs check-tree
        env:
          CONFIDENTIAL_HMAC_KEY: ${{ secrets.CONFIDENTIAL_HMAC_KEY }}
          CONFIDENTIAL_KEY_OPTIONAL: ${{ (github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '1' || '' }}
      - run: npm ci
      - name: Content QA (secrets, copy rules) over every tracked file
        run: npm run check:content
        env:
          # No key here: the keyed name check ran in the step above.
          CONFIDENTIAL_KEY_OPTIONAL: "1"
          CONFIDENTIAL_NAMES_CHECKED: "1"
      - name: Generate the Worker and widget content modules
        run: node worker/scripts/gen-content.mjs --require-content
      - run: npm run typecheck
      - name: Unit tests (Worker + widget)
        run: npx vitest run
      - name: Widget size budget
        run: npm run widget:size

  widget-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node worker/scripts/gen-content.mjs --require-content
      - run: npx playwright install --with-deps chromium
      - run: npm run test:widget

  site-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm ci --prefix site
      - run: node worker/scripts/gen-content.mjs --require-content
      - run: npm --prefix site run test:unit
