<svg xmlns="http://www.w3.org/2000/svg" width="352" height="1064" fill="none" aria-describedby="dg-empoweromics-message-routing-c-desc" aria-labelledby="dg-empoweromics-message-routing-c-title" class="dg dg-compact" direction="ltr" lang="en" role="img" viewBox="0 0 352 1064"><title id="dg-empoweromics-message-routing-c-title">WhatsApp message routing and data integration at Empoweromics</title><desc id="dg-empoweromics-message-routing-c-desc">Architecture diagram in two parts. Message routing: incoming WhatsApp messages are classified, text with an NLP model and images with a computer-vision model, and routed by department to Tech, HR, Accounting, Operations or Marketing. Data engineering: an ETL pipeline moves data from Cosmos DB (NoSQL) to Microsoft SQL Server on scheduled Azure triggers; a data-integration system merges data from 3,008+ real-estate developers, each with its own schema, to feed the real-time e-map.</desc><style>@keyframes dg-p{0%{stroke-dashoffset:18px}12%,to{stroke-dashoffset:calc(var(--L)*-1)}}.dg{--_cv:var(--dg-canvas,var(--color-bg,#FBF8F3));--_nd:var(--dg-node,var(--color-surface,#FFFEFB));--_ink:var(--color-ink,#14212B);--_ink2:var(--color-ink-2,#33414C);--_mut:var(--color-muted,#5A6670);--_lns:var(--color-line-strong,#D6CCBA);--_edge:var(--color-line-input,#8E8676);--_grid:var(--color-graph-grid,#DDD3C2);--_teal:var(--color-teal,#0A766C);--_teal-f:var(--color-teal-fill,#16A394);--_teal-b:var(--color-teal-tint,#E3F1EE);--_teal-l:var(--color-teal-tint-line,#B9DFD8);--_saffron:var(--color-saffron,#9C5800);--_saffron-f:var(--color-saffron-fill,#E9A23B);--_saffron-b:var(--color-saffron-tint,#FAEFDC);--_saffron-l:var(--color-saffron-tint-line,#F0D3A4);--_coral:var(--color-coral,#B3421C);--_coral-f:var(--color-coral-fill,#E4683F);--_coral-b:var(--color-coral-tint,#FAE7DF);--_coral-l:var(--color-coral-tint-line,#F0BFA9);--_slate:var(--color-slate,#4A6072);--_slate-f:var(--color-slate-fill,#7F99AE);--_slate-b:var(--color-slate-tint,#E8EDF1);--_slate